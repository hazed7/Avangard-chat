x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: "${DOCKER_IMAGE:?DOCKER_IMAGE is required}"
    pull_policy: always
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}"
      LIVEKIT_URL: "${LIVEKIT_URL:?LIVEKIT_URL is required}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      REFRESH_TOKEN_SECRET_KEY: "${REFRESH_TOKEN_SECRET_KEY:?REFRESH_TOKEN_SECRET_KEY is required}"
      MESSAGE_CURSOR_SECRET_KEY: "${MESSAGE_CURSOR_SECRET_KEY:?MESSAGE_CURSOR_SECRET_KEY is required}"
      MESSAGE_ENCRYPTION_ACTIVE_KEY_ID: "${MESSAGE_ENCRYPTION_ACTIVE_KEY_ID:?MESSAGE_ENCRYPTION_ACTIVE_KEY_ID is required}"
      MESSAGE_ENCRYPTION_KEYS: "${MESSAGE_ENCRYPTION_KEYS:?MESSAGE_ENCRYPTION_KEYS is required}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      AI_API_KEY: "${AI_API_KEY:?AI_API_KEY is required}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.groq.com/openai/v1}"
      AI_SUMMARY_MODEL: "${AI_SUMMARY_MODEL:-llama-3.3-70b-versatile}"
      AI_TRANSCRIPTION_MODEL: "${AI_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}"
    logging: *default-logging

  mongodb:
    image: "${MONGODB_IMAGE:?MONGODB_IMAGE is required}"
    logging: *default-logging

  dragonfly:
    image: "${DRAGONFLY_IMAGE:?DRAGONFLY_IMAGE is required}"
    logging: *default-logging

  livekit:
    image: "${LIVEKIT_IMAGE:?LIVEKIT_IMAGE is required}"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
    logging: *default-logging

  typesense:
    image: "${TYPESENSE_IMAGE:?TYPESENSE_IMAGE is required}"
    command: "--data-dir=/data --api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required} --enable-cors"
    logging: *default-logging

  s3:
    image: "${S3_IMAGE:?S3_IMAGE is required}"
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
    logging: *default-logging

  prometheus:
    image: "${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE is required}"
    logging: *default-logging

  grafana:
    image: "${GRAFANA_IMAGE:?GRAFANA_IMAGE is required}"
    logging: *default-logging

  caddy:
    image: "${CADDY_IMAGE:?CADDY_IMAGE is required}"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN is required}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:

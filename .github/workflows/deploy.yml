name: Deploy to Server

on:
  push:
    branches:
      - main
      - master

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repo name
        id: repo_name
        run: |
          echo "lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.lowercase }}/app:latest
            ghcr.io/${{ steps.repo_name.outputs.lowercase }}/app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Downcase repo name
        id: repo_name
        run: |
          echo "lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yml,prometheus.yml,deploy/livekit.yaml"
          target: "/opt/avangard-chat"
          strip_components: 0

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          REFRESH_TOKEN_SECRET_KEY: ${{ secrets.REFRESH_TOKEN_SECRET_KEY }}
          MESSAGE_CURSOR_SECRET_KEY: ${{ secrets.MESSAGE_CURSOR_SECRET_KEY }}
          MESSAGE_ENCRYPTION_ACTIVE_KEY_ID: ${{ secrets.MESSAGE_ENCRYPTION_ACTIVE_KEY_ID }}
          MESSAGE_ENCRYPTION_KEYS: ${{ secrets.MESSAGE_ENCRYPTION_KEYS }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_TOKEN,JWT_SECRET_KEY,REFRESH_TOKEN_SECRET_KEY,MESSAGE_CURSOR_SECRET_KEY,MESSAGE_ENCRYPTION_ACTIVE_KEY_ID,MESSAGE_ENCRYPTION_KEYS,TYPESENSE_API_KEY,LIVEKIT_API_KEY,LIVEKIT_API_SECRET,S3_ACCESS_KEY,S3_SECRET_KEY,AI_API_KEY
          script: |
            cd /opt/avangard-chat
            
            required_env() {
              local var_name=$1
              local var_val=$2
              if [ -z "$var_val" ]; then
                echo "Missing required secret: ${var_name}" >&2
                exit 1
              fi
            }
            
            # Ensure .env file exists and has correct image and livekit settings
            if [ ! -f .env ]; then
              echo "Creating initial .env file..."
              echo "DOCKER_IMAGE=ghcr.io/${{ steps.repo_name.outputs.lowercase }}/app:latest" > .env
              echo "LIVEKIT_URL=ws://${{ secrets.SSH_HOST }}:7880" >> .env
            else
              # Update image tag just in case
              sed -i 's|^DOCKER_IMAGE=.*|DOCKER_IMAGE=ghcr.io/${{ steps.repo_name.outputs.lowercase }}/app:latest|' .env
            fi
            
            # Function to safely write/update environment variables in .env
            write_env_var() {
              local var_name=$1
              local var_val=$2
              
              # Check if secret is missing to prevent fallback to dev credentials
              required_env "$var_name" "$var_val"
              
              # Escape $ as $$ for Docker Compose interpolation
              var_val=$(echo "$var_val" | sed 's/\$/\$\$/g')
              
              if grep -q "^${var_name}=" .env; then
                # Escape value for sed replacement
                local escaped_val=$(echo "$var_val" | sed 's/[&/\]/\\&/g')
                sed -i "s|^${var_name}=.*|${var_name}=${escaped_val}|" .env
              else
                echo "${var_name}=${var_val}" >> .env
              fi
            }

            write_env_var "JWT_SECRET_KEY" "$JWT_SECRET_KEY"
            write_env_var "REFRESH_TOKEN_SECRET_KEY" "$REFRESH_TOKEN_SECRET_KEY"
            write_env_var "MESSAGE_CURSOR_SECRET_KEY" "$MESSAGE_CURSOR_SECRET_KEY"
            write_env_var "MESSAGE_ENCRYPTION_ACTIVE_KEY_ID" "$MESSAGE_ENCRYPTION_ACTIVE_KEY_ID"
            write_env_var "MESSAGE_ENCRYPTION_KEYS" "$MESSAGE_ENCRYPTION_KEYS"
            write_env_var "TYPESENSE_API_KEY" "$TYPESENSE_API_KEY"
            write_env_var "LIVEKIT_API_KEY" "$LIVEKIT_API_KEY"
            write_env_var "LIVEKIT_API_SECRET" "$LIVEKIT_API_SECRET"
            write_env_var "S3_ACCESS_KEY" "$S3_ACCESS_KEY"
            write_env_var "S3_SECRET_KEY" "$S3_SECRET_KEY"
            write_env_var "AI_API_KEY" "$AI_API_KEY"

            # Authenticate to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the new image and recreate containers
            docker compose pull app
            docker compose up -d
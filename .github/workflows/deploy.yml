name: Production Deploy

on:
  workflow_run:
    workflows:
      - Avangard CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit SHA to deploy
        required: false
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'master'
        )
      )
    runs-on: ubuntu-latest
    outputs:
      deploy_ref: ${{ steps.meta.outputs.deploy_ref }}
      image_repo: ${{ steps.meta.outputs.image_repo }}

    steps:
      - name: Compute deployment metadata
        id: meta
        env:
          MANUAL_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            deploy_ref="${MANUAL_REF:-main}"
          else
            deploy_ref="${{ github.event.workflow_run.head_sha }}"
          fi

          echo "deploy_ref=${deploy_ref}" >> "$GITHUB_OUTPUT"
          echo "image_repo=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.git_meta.outputs.deploy_sha }}
      image_ref: ${{ steps.image_ref.outputs.image_ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.deploy_ref }}

      - name: Capture git metadata
        id: git_meta
        run: |
          set -euo pipefail
          echo "deploy_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_repo }}:latest
            ${{ needs.prepare.outputs.image_repo }}:sha-${{ steps.git_meta.outputs.deploy_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.git_meta.outputs.deploy_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable image reference
        id: image_ref
        run: |
          set -euo pipefail
          echo "image_ref=${{ needs.prepare.outputs.image_repo }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs:
      - prepare
      - build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.deploy_ref }}

      - name: Copy deployment assets to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yml,compose.prod.yml,prometheus.yml,deploy"
          target: "${{ secrets.DEPLOY_PATH || '/opt/avangard-chat' }}"
          strip_components: 0

      - name: Run production rollout
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.DEPLOY_PATH || '/opt/avangard-chat' }}
          DOCKER_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          DEPLOY_SHA: ${{ needs.build-and-push.outputs.deploy_sha }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          REFRESH_TOKEN_SECRET_KEY: ${{ secrets.REFRESH_TOKEN_SECRET_KEY }}
          MESSAGE_CURSOR_SECRET_KEY: ${{ secrets.MESSAGE_CURSOR_SECRET_KEY }}
          MESSAGE_ENCRYPTION_ACTIVE_KEY_ID: ${{ secrets.MESSAGE_ENCRYPTION_ACTIVE_KEY_ID }}
          MESSAGE_ENCRYPTION_KEYS: ${{ secrets.MESSAGE_ENCRYPTION_KEYS }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          MONGODB_IMAGE: ${{ secrets.MONGODB_IMAGE || 'mongo:4.4.29' }}
          DRAGONFLY_IMAGE: ${{ secrets.DRAGONFLY_IMAGE || 'docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1' }}
          LIVEKIT_IMAGE: ${{ secrets.LIVEKIT_IMAGE || 'livekit/livekit-server:v1.11.0' }}
          TYPESENSE_IMAGE: ${{ secrets.TYPESENSE_IMAGE || 'typesense/typesense:27.1' }}
          S3_IMAGE: ${{ secrets.S3_IMAGE || 'rustfs/rustfs:latest' }}
          PROMETHEUS_IMAGE: ${{ secrets.PROMETHEUS_IMAGE || 'prom/prometheus:latest' }}
          GRAFANA_IMAGE: ${{ secrets.GRAFANA_IMAGE || 'grafana/grafana:latest' }}
          CADDY_IMAGE: ${{ secrets.CADDY_IMAGE || 'caddy:2.8' }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_SUMMARY_MODEL: ${{ secrets.AI_SUMMARY_MODEL }}
          AI_TRANSCRIPTION_MODEL: ${{ secrets.AI_TRANSCRIPTION_MODEL }}
          TRUSTED_PROXY_CIDRS: ${{ secrets.TRUSTED_PROXY_CIDRS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_DIR,DOCKER_IMAGE,DEPLOY_SHA,APP_DOMAIN,GHCR_USERNAME,GHCR_TOKEN,LIVEKIT_URL,JWT_SECRET_KEY,REFRESH_TOKEN_SECRET_KEY,MESSAGE_CURSOR_SECRET_KEY,MESSAGE_ENCRYPTION_ACTIVE_KEY_ID,MESSAGE_ENCRYPTION_KEYS,TYPESENSE_API_KEY,LIVEKIT_API_KEY,LIVEKIT_API_SECRET,S3_ACCESS_KEY,S3_SECRET_KEY,AI_API_KEY,MONGODB_IMAGE,DRAGONFLY_IMAGE,LIVEKIT_IMAGE,TYPESENSE_IMAGE,S3_IMAGE,PROMETHEUS_IMAGE,GRAFANA_IMAGE,CADDY_IMAGE,AI_BASE_URL,AI_SUMMARY_MODEL,AI_TRANSCRIPTION_MODEL,TRUSTED_PROXY_CIDRS
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            chmod +x deploy/server-deploy.sh
            ./deploy/server-deploy.sh
